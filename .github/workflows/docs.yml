# Managed by the repository kit (muhittincamdali/.github). Pages source must be "GitHub Actions".
name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  docc:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: muhittincamdali/.github/.github/workflows/docc-pages.yml@85ec2fa95f3607e09168f14b744bd3154fdc7d43 # v1.1.0
    with:
      targets: SwiftUIAnimationMasterclass
      deploy: ${{ github.event_name != 'pull_request' }}
      # The views, modifiers and transitions would otherwise get a page for every member they
      # inherit from View, ViewModifier and Transition, which makes the site too large for Pages.
      skip-synthesized-members: true
